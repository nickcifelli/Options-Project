[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vol-surface"
version = "0.1.0"
description = "Options pricer and implied volatility surface builder"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "yfinance",
    "matplotlib",
    "plotly",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
vol-surface = "vol_surface.cli:main"

[tool.setuptools.packages.find]
include = ["vol_surface*"]
